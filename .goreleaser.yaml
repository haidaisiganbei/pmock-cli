version: 2

project_name: pmock-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: pmock-cli
    main: .
    binary: pmock-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/haidaisiganbei/pmock-cli/internal/build.Version={{.Version}}
      - -X github.com/haidaisiganbei/pmock-cli/internal/build.Commit={{.Commit}}
      - -X github.com/haidaisiganbei/pmock-cli/internal/build.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
