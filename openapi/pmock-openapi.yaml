components:
  schemas:
    PhoneCreateReqVOCreate:
      type: object
      properties:
        spuId:
          type: integer
          description: 商品 SPU ID
          format: int64
        skuId:
          type: integer
          description: 商品 SKU ID
          format: int64
        num:
          type: integer
          description: 购买数量
          minimum: 1
        realResolution:
          type: boolean
          description: 是否真机分辨率
        brand:
          type: string
          description: 品牌名称
        width:
          type: integer
          description: 分辨率宽度
        height:
          type: integer
          description: 分辨率高度
        phoneNumber:
          type: string
          description: 手机号
        configId:
          type: integer
          description: >-
            手机机型 ID，根据“获取机型列表”接口返回的 ID 创建对应机型的手机
          format: int64
        autoInstallFlag:
          type: integer
          description: '自动安装标志：0=关闭，1=开启'
          default: 0
        groupId:
          type: integer
          description: 分组ID，不传则为未分组
          format: int64
        remark:
          type: string
          description: 备注，最多200字符
        tagIds:
          type: array
          items:
            type: integer
          description: 标签ID列表，最多5个
      required:
        - spuId
        - skuId
        - num
    PhoneInfoResVO:
      type: object
      properties:
        id:
          type: integer
          description: 手机ID
          format: int64
        name:
          type: string
          description: 手机名称
        code:
          type: string
          description: 手机编码，业务侧自定义
    RListPhoneInfoResVO:
      type: object
      properties:
        traceId:
          type: string
          description: 请求链路 ID
        code:
          type: integer
          description: 状态码
        msg:
          type: string
          description: 请求返回消息
        data:
          type: array
          items:
            $ref: '#/components/schemas/PhoneInfoResVO'
            description: 手机信息响应对象
          description: 请求返回数据
        status:
          type: string
          description: >-
            状态，表示任务是立即完成还是处于等待状态：finish=已完成，pending=等待中
          default: finish
      required:
        - traceId
        - code
        - msg
        - status
    TableDataInfoPhonePageListResVO:
      type: object
      properties:
        traceId:
          type: string
          description: 链路id
        total:
          type: integer
          description: 总记录数
          format: int64
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PhonePageListResVO'
            description: 手机列表响应对象
          description: 列表数据
        code:
          type: integer
          description: 消息状态码
        msg:
          type: string
          description: 消息内容
    PhonePageListResVO:
      type: object
      properties:
        id:
          type: integer
          description: 手机ID
          format: int64
        name:
          type: string
          description: 手机名称
        groupId:
          type: integer
          description: 手机分组ID
          format: int64
        groupName:
          type: string
          description: 手机分组名称
        code:
          type: string
          description: 手机编码，业务侧自定义
        spuId:
          type: integer
          description: 商品 SPU ID
          format: int64
        spuName:
          type: string
          description: spu名称
        skuId:
          type: integer
          description: 商品 SKU ID
          format: int64
        phoneModel:
          type: string
          description: 手机型号
        phoneBrand:
          type: string
          description: 手机品牌
        adbIp:
          type: string
          description: adbip信息
        adbPort:
          type: string
          description: adb端口
        adbPassword:
          type: string
          description: adb密码
        payType:
          type: integer
          description: 扣费类型：1=包年包月，2=每N分钟
        skuName:
          type: string
          description: sku名称
        cycleName:
          type: string
          description: 计费周期名字
        cycleEnum:
          type: string
          description: 计费周期枚举值
        expireStatus:
          type: integer
          description: 计费(过期)状态：0=已经过期，1=正常
        networkId:
          type: integer
          description: 绑定网络ID
          format: int64
        channel:
          type: string
          description: 渠道
        powerOnTime:
          type: string
          description: 最近开机时间
        powerOffTime:
          type: string
          description: 最近关机时间
        expireTime:
          type: string
          description: 过期时间
        expireDuration:
          type: string
          description: 过期时长
        nextPayTime:
          type: string
          description: 下次需要支付的时间
        status:
          type: integer
          description: 状态
          enum:
            - 1
            - 2
            - 4
            - 41
            - 6
            - 7
        remark:
          type: string
          description: 备注说明
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSimpleResVO'
            description: 标签简要响应对象
          description: 标签列表
        userId:
          type: integer
          description: 授权用户id
          format: int64
        createUser:
          type: string
          description: 创建人
        createTime:
          type: string
          description: 创建时间
        updateTime:
          type: string
          description: 最近修改时间
        networkResVO:
          $ref: '#/components/schemas/PhoneSimpleNetWorkResVO'
          description: 手机网络信息
        envSettingResVO:
          $ref: '#/components/schemas/PhoneEnvSettingResVO'
          description: 手机环境设置信息
        authorizeResVO:
          $ref: '#/components/schemas/PhoneAuthorizeResVO'
          description: 授权用户信息
        authList:
          type: array
          items:
            $ref: '#/components/schemas/PhoneAuthorizeResVO'
            description: 手机授权响应对象
          description: 授权用户信息列表
